<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="cms-config-url" type="text/yaml" href="/admin/test-config.yml">
<title>Edit portfolio · Nik Rakar</title>
<link rel="icon" type="image/png" href="/face.png">
<style>
/* Photos shown as a grid of cards instead of one long list */
section.field[data-key-path="items"] .item-list{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;align-items:start}
/* a photo opened for editing takes the full width */
section.field[data-key-path="items"] .item-wrapper:has(> .item > .header .start button[aria-expanded="true"]){grid-column:1/-1}
section.field[data-key-path="items"] .item:has(> .header .start button[aria-expanded="false"]){height:100%;display:flex;flex-direction:column}
section.field[data-key-path="items"] .item:has(> .header .start button[aria-expanded="false"]) .header [data-action="move-up"],
section.field[data-key-path="items"] .item:has(> .header .start button[aria-expanded="false"]) .header [data-action="move-down"]{display:none}
section.field[data-key-path="items"] .item:has(> .header .start button[aria-expanded="false"]) .item-body{flex:1;cursor:pointer}
section.field[data-key-path="items"] .item:has(> .header .start button[aria-expanded="false"]) .item-body .summary{flex-direction:column!important;align-items:stretch!important;gap:6px!important;padding:6px 8px 10px!important}
section.field[data-key-path="items"] .item:has(> .header .start button[aria-expanded="false"]) .item-body .summary img{display:block;width:100%!important;height:150px!important;max-width:none!important;max-height:none!important;object-fit:cover;border-radius:8px}
section.field[data-key-path="items"] .item:has(> .header .start button[aria-expanded="false"]) .item-body .summary :has(> img){width:100%!important;height:auto!important;max-width:none!important;max-height:none!important}
</style>
<script>
/* clicking a photo card opens it for editing */
document.addEventListener("click", e => {
  const body = e.target.closest('section.field[data-key-path="items"] .item-body');
  if (!body) return;
  const btn = body.closest(".item").querySelector(':scope > .header .start button[aria-expanded="false"]');
  if (btn) btn.click();
});
</script>
</head>
<body>
<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
</body>
</html>
