# Admin page for rakarnik.digital — edit at https://rakarnik.digital/admin
backend:
  name: github
  repo: rakarnikstudio/WEBSITE
  branch: main
  commit_messages:
    update: Update portfolio from admin
site_url: https://rakarnik.digital
display_url: https://rakarnik.digital
logo_url: /face.png
media_folder: photos
public_folder: /photos
media_libraries:
  default:
    config:
      max_file_size: 95000000
      transformations:
        raster_image:
          format: webp
          quality: 90
          width: 4000
          height: 4000
collections:
- name: portfolio
  label: Portfolio
  editor:
    preview: false
  files:
  - name: photos
    label: Photos & details
    file: data/site.json
    format: json
    description: Add, remove and reorder photos and videos, then press Save. Your About text and contact details are further down.
    fields:
    - name: items
      label: Photos & videos
      label_singular: Item
      widget: list
      add_to_top: true
      summary: '{{fields.title}}'
      collapsed: true
      thumbnail: src
      typeKey: kind
      types:
      - name: image
        label: Photo
        widget: object
        summary: '{{fields.title}}'
        fields:
        - name: src
          label: Photo
          widget: image
          hint: Any size JPG or PNG; it is saved at up to 4000 px
        - &id001
          name: cat
          label: Category
          widget: relation
          collection: portfolio
          file: categories
          value_field: cats.*.id
          display_fields:
          - cats.*.name
          search_fields:
          - cats.*.name
          hint: Rename or add categories under Portfolio → Categories
        - &id002
          name: title
          label: Title (optional)
          widget: string
          required: false
        - name: cover
          label: Use as the big cover photo
          widget: boolean
          default: false
          required: false
          hint: 'Only one photo can be the cover: turn this off on the old cover photo when you pick a new one'
        - name: thumb
          widget: hidden
          required: false
        - name: w
          widget: hidden
          required: false
        - name: h
          widget: hidden
          required: false
      - name: video
        label: Video file
        widget: object
        summary: '{{fields.title}}'
        fields:
        - name: src
          label: Video
          widget: file
          media_folder: /videos
          public_folder: /videos
          accept: video/mp4,video/webm,video/quicktime
          hint: MP4 works best. Keep it under 95 MB (best under 50 MB); for longer films use “Video link” instead
        - name: poster
          label: Cover image (optional)
          widget: image
          required: false
          hint: The still shown on the grid before the video plays
        - *id001
        - *id002
      - name: link
        label: Video link (YouTube / Vimeo)
        widget: object
        summary: '{{fields.title}}'
        fields:
        - name: url
          label: YouTube or Vimeo link
          widget: string
          hint: Paste the link from the address bar or the Share button, e.g. https://youtu.be/…
        - name: poster
          label: Cover image (optional)
          widget: image
          required: false
          hint: 'Optional: YouTube makes one automatically'
        - *id001
        - *id002
    - name: profile
      label: About me & contact
      widget: object
      fields:
      - name: name
        label: Name
        widget: string
      - name: role
        label: What you do
        widget: string
      - name: role_sl
        label: What you do (Slovenian)
        widget: string
        required: false
      - name: location
        label: Location
        widget: string
      - name: headline
        label: About headline
        widget: string
        required: false
        hint: e.g. Hi, I'm Nik.
      - name: headline_sl
        label: About headline (Slovenian)
        widget: string
        required: false
      - name: photo
        label: About photo
        widget: image
        required: false
        hint: A photo of you; portrait (vertical) works best
      - name: about
        label: About text
        widget: text
        hint: The first paragraph shows large. Leave an empty line between paragraphs.
      - name: about_sl
        label: About text (Slovenian)
        widget: text
        required: false
      - name: years
        label: Shooting for
        widget: string
        required: false
        hint: e.g. 4 years (leave empty to hide)
      - name: gear
        label: Camera
        widget: string
        required: false
        hint: e.g. Sony A7 III (leave empty to hide)
      - name: email
        label: Email
        widget: string
        required: false
      - name: instagram
        label: Instagram username
        widget: string
        required: false
      - name: available
        label: Show "Available for shoots"
        widget: boolean
        default: true
    - name: categories
      widget: hidden
    - name: services
      widget: hidden
    - name: cover
      widget: hidden
      required: false
    - name: pages
      widget: hidden
      required: false
  - name: categories
    label: Categories
    file: data/categories.json
    format: json
    description: Rename, reorder, add or remove categories. Photos stay linked when you rename one.
    fields:
    - name: cats
      label: Categories
      label_singular: Category
      widget: list
      collapsed: true
      summary: '{{fields.name}}'
      fields:
      - name: id
        widget: hidden
        default: '{{uuid_short}}'
      - name: name
        label: Name
        widget: string
        hint: Shown on the filters, cards and category page, e.g. Street photography
      - name: name_sl
        label: Name (Slovenian)
        widget: string
        required: false
      - name: icon
        label: Icon
        widget: select
        options: &id003
        - label: Person
          value: Portraits
        - label: Car
          value: Automotive
        - label: Coffee cup
          value: Lifestyle
        - label: Ball
          value: Sports
        - label: Film camera
          value: Film
        - label: Photo camera
          value: camera
        - label: City / street
          value: city
        - label: Mountains / nature
          value: mountain
        - label: Heart / weddings
          value: heart
        - label: Music / concerts
          value: music
        - label: Plane / travel
          value: plane
        - label: Sparkle / other
          value: spark
        default: camera
      - name: what
        label: Card text
        widget: string
        required: false
        hint: One line under the name in “What I shoot”
      - name: what_sl
        label: Card text (Slovenian)
        widget: string
        required: false
      - name: kind
        label: Label
        widget: string
        required: false
        hint: Small tag, e.g. Photo · Video
      - name: description
        label: Category page description
        widget: text
        required: false
      - name: description_sl
        label: Category page description (Slovenian)
        widget: text
        required: false
  - name: business
    label: Clients page
    file: data/business.json
    format: json
    description: Prices, how it works, FAQ, brands, client quotes, projects and showreel. Empty sections stay hidden on the site. Fields marked (Slovenian) show when visitors switch to SLO.
    fields:
    - name: showreel
      label: Showreel
      widget: object
      collapsed: true
      hint: A YouTube/Vimeo link or a video file. Leave both empty to hide it
      fields:
      - name: url
        label: YouTube or Vimeo link
        widget: string
        required: false
      - name: src
        label: …or a video file
        widget: file
        required: false
        media_folder: /videos
        public_folder: /videos
        accept: video/mp4,video/webm,video/quicktime
        hint: MP4 under 95 MB, plays silently on loop
      - name: poster
        label: Cover image (optional)
        widget: image
        required: false
    - name: packages
      label: Services & prices
      label_singular: Package
      widget: list
      collapsed: true
      summary: '{{fields.name}} · {{fields.price}}'
      fields:
      - name: name
        label: Name
        widget: string
        required: true
      - name: name_sl
        label: Name (Slovenian)
        widget: string
        required: false
      - name: price
        label: Starting price
        widget: string
        required: false
        hint: e.g. €120. Leave empty to show “Price on request”
      - name: icon
        label: Icon
        widget: select
        options: *id003
        default: camera
      - name: desc
        label: Short description
        widget: text
        required: false
      - name: desc_sl
        label: Short description (Slovenian)
        widget: text
        required: false
      - name: includes
        label: What's included
        widget: text
        required: false
        hint: One item per line
      - name: includes_sl
        label: What's included (Slovenian)
        widget: text
        required: false
      - name: featured
        label: Highlight as popular
        widget: boolean
        default: false
        required: false
    - name: steps
      label: How it works
      label_singular: Step
      widget: list
      collapsed: true
      summary: '{{fields.title}}'
      fields:
      - name: title
        label: Title
        widget: string
        required: true
      - name: title_sl
        label: Title (Slovenian)
        widget: string
        required: false
      - name: text
        label: Text
        widget: text
        required: false
      - name: text_sl
        label: Text (Slovenian)
        widget: text
        required: false
    - name: faq
      label: FAQ
      label_singular: Question
      widget: list
      collapsed: true
      summary: '{{fields.q}}'
      fields:
      - name: q
        label: Question
        widget: string
        required: true
      - name: q_sl
        label: Question (Slovenian)
        widget: string
        required: false
      - name: a
        label: Answer
        widget: text
        required: false
      - name: a_sl
        label: Answer (Slovenian)
        widget: text
        required: false
    - name: brands
      label: Brands you worked with
      label_singular: Brand
      widget: list
      collapsed: true
      summary: '{{fields.name}}'
      hint: Only add brands that are OK with being shown
      fields:
      - name: name
        label: Brand name
        widget: string
        required: true
      - name: logo
        label: Logo (optional)
        widget: image
        required: false
        hint: PNG with a transparent background looks best
      - name: url
        label: Website or Instagram link (optional)
        widget: string
        required: false
    - name: quotes
      label: Client quotes
      label_singular: Quote
      widget: list
      collapsed: true
      summary: '{{fields.name}}'
      hint: Real words from real clients, with their permission
      fields:
      - name: quote
        label: Quote
        widget: text
        required: true
      - name: quote_sl
        label: Quote (Slovenian)
        widget: text
        required: false
      - name: name
        label: Name
        widget: string
        required: true
      - name: role
        label: Role or brand
        widget: string
        required: false
        hint: e.g. Owner, Brand X
      - name: role_sl
        label: Role or brand (Slovenian)
        widget: string
        required: false
    - name: cases
      label: Projects (case studies)
      label_singular: Project
      widget: list
      collapsed: true
      summary: '{{fields.title}}'
      fields:
      - name: title
        label: Project title
        widget: string
        required: true
      - name: title_sl
        label: Project title (Slovenian)
        widget: string
        required: false
      - name: client
        label: Client / brand
        widget: string
        required: false
      - name: year
        label: Year
        widget: string
        required: false
      - name: cat
        label: Category
        widget: relation
        collection: portfolio
        file: categories
        value_field: cats.*.id
        display_fields:
        - cats.*.name
        search_fields:
        - cats.*.name
        required: false
      - name: cover
        label: Cover photo
        widget: image
        required: false
      - name: summary
        label: One-line summary
        widget: string
        required: false
      - name: summary_sl
        label: One-line summary (Slovenian)
        widget: string
        required: false
      - name: brief
        label: 'The brief: what they needed'
        widget: text
        required: false
      - name: brief_sl
        label: The brief (Slovenian)
        widget: text
        required: false
      - name: delivered
        label: What you delivered
        widget: text
        required: false
      - name: delivered_sl
        label: What you delivered (Slovenian)
        widget: text
        required: false
      - name: result
        label: The result
        widget: text
        required: false
      - name: result_sl
        label: The result (Slovenian)
        widget: text
        required: false
      - name: video_url
        label: YouTube or Vimeo link (optional)
        widget: string
        required: false
      - name: video
        label: …or a video file (optional)
        widget: file
        required: false
        media_folder: /videos
        public_folder: /videos
        accept: video/mp4,video/webm,video/quicktime
      - name: photos
        label: Photos
        label_singular: Photo
        widget: list
        collapsed: true
        thumbnail: src
        required: false
        fields:
        - name: src
          label: Photo
          widget: image
    - name: contact
      label: Contact extras
      widget: object
      collapsed: true
      fields:
      - name: whatsapp
        label: WhatsApp number (optional)
        widget: string
        required: false
        hint: With country code, e.g. +386 40 123 456. Adds a WhatsApp button
      - name: response
        label: Note under the Send button (optional)
        widget: string
        required: false
        hint: e.g. I usually reply within a day
      - name: response_sl
        label: Note under the Send button (Slovenian)
        widget: string
        required: false
