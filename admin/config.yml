# Admin page for rakarnik.digital — edit at https://rakarnik.digital/admin
backend:
  name: github
  repo: rakarnikstudio/WEBSITE
  branch: main
  commit_messages:
    update: Update portfolio from admin
site_url: https://rakarnik.digital
display_url: https://rakarnik.digital
logo_url: /face.png
media_folder: photos
public_folder: /photos
media_libraries:
  default:
    config:
      max_file_size: 95000000
      transformations:
        raster_image:
          format: webp
          quality: 90
          width: 4000
          height: 4000
collections:
- name: portfolio
  label: Portfolio
  editor:
    preview: false
  files:
  - name: photos
    label: Photos & details
    file: data/site.json
    format: json
    description: Add, remove and reorder photos and videos, then press Save. Your About text and contact details are further down.
    fields:
    - name: items
      label: Photos & videos
      label_singular: Item
      widget: list
      add_to_top: true
      summary: '{{fields.title}}'
      collapsed: true
      thumbnail: src
      typeKey: kind
      types:
      - name: image
        label: Photo
        widget: object
        summary: '{{fields.title}}'
        fields:
        - name: src
          label: Photo
          widget: image
          hint: Any size JPG or PNG; it is saved at up to 4000 px
        - &id001
          name: cat
          label: Category
          widget: relation
          collection: portfolio
          file: categories
          value_field: cats.*.id
          display_fields:
          - cats.*.name
          search_fields:
          - cats.*.name
          hint: Rename or add categories under Portfolio → Categories
        - &id002
          name: title
          label: Title (optional)
          widget: string
          required: false
        - name: cover
          label: Use as the big cover photo
          widget: boolean
          default: false
          required: false
          hint: 'Only one photo can be the cover: turn this off on the old cover photo when you pick a new one'
        - name: thumb
          widget: hidden
          required: false
        - name: w
          widget: hidden
          required: false
        - name: h
          widget: hidden
          required: false
      - name: video
        label: Video file
        widget: object
        summary: '{{fields.title}}'
        fields:
        - name: src
          label: Video
          widget: file
          media_folder: /videos
          public_folder: /videos
          accept: video/mp4,video/webm,video/quicktime
          hint: MP4 works best. Keep it under 95 MB (best under 50 MB); for longer films use “Video link” instead
        - name: poster
          label: Cover image (optional)
          widget: image
          required: false
          hint: The still shown on the grid before the video plays
        - *id001
        - *id002
      - name: link
        label: Video link (YouTube / Vimeo)
        widget: object
        summary: '{{fields.title}}'
        fields:
        - name: url
          label: YouTube or Vimeo link
          widget: string
          hint: Paste the link from the address bar or the Share button, e.g. https://youtu.be/…
        - name: poster
          label: Cover image (optional)
          widget: image
          required: false
          hint: 'Optional: YouTube makes one automatically'
        - *id001
        - *id002
    - name: profile
      label: About me & contact
      widget: object
      fields:
      - name: name
        label: Name
        widget: string
      - name: role
        label: What you do
        widget: string
      - name: location
        label: Location
        widget: string
      - name: headline
        label: About headline
        widget: string
        required: false
        hint: e.g. Hi, I'm Nik.
      - name: photo
        label: About photo
        widget: image
        required: false
        hint: A photo of you; portrait (vertical) works best
      - name: about
        label: About text
        widget: text
        hint: The first paragraph shows large. Leave an empty line between paragraphs.
      - name: years
        label: Shooting for
        widget: string
        required: false
        hint: e.g. 4 years (leave empty to hide)
      - name: gear
        label: Camera
        widget: string
        required: false
        hint: e.g. Sony A7 III (leave empty to hide)
      - name: email
        label: Email
        widget: string
        required: false
      - name: instagram
        label: Instagram username
        widget: string
        required: false
      - name: available
        label: Show "Available for shoots"
        widget: boolean
        default: true
    - name: categories
      widget: hidden
    - name: services
      widget: hidden
    - name: cover
      widget: hidden
      required: false
    - name: pages
      widget: hidden
      required: false
  - name: categories
    label: Categories
    file: data/categories.json
    format: json
    description: Rename, reorder, add or remove categories. Photos stay linked when you rename one.
    fields:
    - name: cats
      label: Categories
      label_singular: Category
      widget: list
      collapsed: true
      summary: '{{fields.name}}'
      fields:
      - name: id
        widget: hidden
        default: '{{uuid_short}}'
      - name: name
        label: Name
        widget: string
        hint: Shown on the filters, cards and category page, e.g. Street photography
      - name: icon
        label: Icon
        widget: select
        options:
        - label: Person
          value: Portraits
        - label: Car
          value: Automotive
        - label: Coffee cup
          value: Lifestyle
        - label: Ball
          value: Sports
        - label: Film camera
          value: Film
        - label: Photo camera
          value: camera
        - label: City / street
          value: city
        - label: Mountains / nature
          value: mountain
        - label: Heart / weddings
          value: heart
        - label: Music / concerts
          value: music
        - label: Plane / travel
          value: plane
        - label: Sparkle / other
          value: spark
        default: camera
      - name: what
        label: Card text
        widget: string
        required: false
        hint: One line under the name in “What I shoot”
      - name: kind
        label: Label
        widget: string
        required: false
        hint: Small tag, e.g. Photo · Video
      - name: description
        label: Category page description
        widget: text
        required: false
